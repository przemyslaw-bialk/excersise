name: Deploy Project
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@7
      - name: Install NodeJS
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm lint
      - name: Message displaying
        run: echo "linting finished..."
